name: Build and deploy website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check executable bits
        run: npm run check:mode

      - name: Validate documentation hosting tools
        run: npm run check:docs-hosting

      - name: Build site
        run: npm run build:pages

      - name: Validate generated HTML
        run: npm run check:html

      - name: Validate canonical URLs
        run: npm run check:canonical-urls

      - name: Validate rendered content and metadata
        run: npm run check:site-semantics && npm run test:content

      - name: Validate classic URL redirects
        run: npm run test:redirect-worker && npm run check:redirect-worker

      - name: Validate email routing
        run: npm run test:email-worker && npm run check:email-worker

      - name: Validate website Worker configuration
        run: npm run check:website-worker

      - name: Collect active HTML pages
        id: active_pages
        run: |
          pages="$(./scripts/list-active-html.sh _site | tr '\n' ' ')"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"

      - name: Accessibility smoke check (Lighthouse)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      - name: Check internal links
        uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6
        with:
          args: >-
            --verbose --no-progress --offline --exclude-mail
            --root-dir '${{ github.workspace }}/_site'
            --exclude '^file://.*/_site/doc(-latest)?(/|$)'
            ${{ steps.active_pages.outputs.pages }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check external links
        continue-on-error: true
        uses: lycheeverse/lychee-action@f613c4a64e50d792e0b31ec34bbcbba12263c6a6
        with:
          args: >-
            --verbose --no-progress --exclude-mail
            --root-dir '${{ github.workspace }}/_site'
            --exclude '^file://.*/_site/doc(-latest)?(/|$)'
            ${{ steps.active_pages.outputs.pages }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: ./_site
          retention-days: 30
          if-no-files-found: error

  deploy:
    # Publish validated main updates; pull requests only build and check.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: website-production
      cancel-in-progress: false
    environment:
      name: website-production
      url: https://www.gecode.dev/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: website
          path: ./_site

      - name: Deploy to Cloudflare Workers static assets
        run: npx wrangler deploy --env production --config workers/website/wrangler.jsonc
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check production availability
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/check-availability.mjs; then exit 0; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            echo "Waiting for the deployment to propagate (attempt $attempt)."
            sleep 20
          done
