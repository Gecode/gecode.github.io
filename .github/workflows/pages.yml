name: Build and Deploy Pages

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --destination ./_site

      - name: Validate generated HTML
        run: npm run check:html

      - name: Accessibility smoke check (Lighthouse)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --offline --exclude-mail
            ./_site/index.html ./_site/download.html ./_site/documentation.html
            ./_site/community.html ./_site/news.html ./_site/publications.html
            ./_site/interfaces.html ./_site/projects.html ./_site/flatzinc.html
            ./_site/license.html ./_site/disclaimer.html ./_site/logo.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check external links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --exclude-mail
            ./_site/index.html ./_site/download.html ./_site/documentation.html
            ./_site/community.html ./_site/news.html ./_site/publications.html
            ./_site/interfaces.html ./_site/projects.html ./_site/flatzinc.html
            ./_site/license.html ./_site/disclaimer.html ./_site/logo.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
