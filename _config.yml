title: Gecode
lang: en
email: info@gecode.dev
description: > # this means to ignore newlines until "baseurl:"
  The Gecode constraint solving library
#baseurl: "/~guidot/new_minizinc" # the subpath of your site, e.g. /blog
baseurl: "" # the subpath of your site, e.g. /blog
#url: "http://s-cah-mwallace.infotech.monash.edu" # the base hostname & protocol for your site
url: "https://www.gecode.dev"
includes_dir: _includes
data_dir: _data
collections:
    publications:
      output: true
    news:
      output: false
# Build settings
markdown: kramdown
plugins:
    - jekyll-feed
    - jekyll-seo-tag
    - jekyll-sitemap
defaults:
    - scope:
        path: "doc"
      values:
        sitemap: false
    - scope:
        path: "doc-latest"
      values:
        sitemap: false
    - scope:
        path: "users-archive"
      values:
        sitemap: false
exclude:
    - README.md
    - package.json
    - package-lock.json
    - lighthouserc.json
    - scripts
    - assets/css/tailwind.css
sass:
    style: compressed
