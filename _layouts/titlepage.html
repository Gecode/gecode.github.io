<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {% include head.html %}
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <div class="site-shell">
      <main id="main-content" class="site-main">
        <div class="site-content">
          <h1 class="visually-hidden">Gecode</h1>
          <section class="title-lockup" aria-label="Gecode tag line">
            <img src="{{ '/images/gecode-logo-120.png' | relative_url }}" alt="Gecode logo" width="196" height="126" decoding="async" fetchpriority="high">
            <div class="title-lockup-text">
              <p class="logofront">generic</p>
              <p class="logofront">constraint</p>
              <p class="logofront">development</p>
              <p class="logofront">environment</p>
            </div>
          </section>

          {{ content }}
        </div>
      </main>
      {% include menu.html %}
    </div>

    {% include footer.html %}
  </body>
</html>
