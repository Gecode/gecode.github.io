title: WordVar Preview Branch

A preview of <code>WordVar</code>, a new variable type for fixed-width machine words, is available on the <a href="https://github.com/Gecode/gecode/tree/feature/wordvar"><code>feature/wordvar</code></a> branch.
A <a href="https://zayenz.se/blog/post/adding-wordvar-to-gecode/">blog post</a> describes the new variable type and how to use it.
