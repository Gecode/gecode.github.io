---
layout: default
title: GECODE news
headline: News Archive
---

<section class="page-section news-archive">
  <ol class="news-archive-list">
  {% for post in site.news reversed %}
    <li class="news-archive-item">
      <p class="news-item-date">
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
      </p>
      <article class="news-entry">
        <h2 class="news-entry-title">{{ post.title }}</h2>
        <div class="news-entry-content">{{ post.content }}</div>
      </article>
    </li>
  {% endfor %}
  </ol>
</section>
